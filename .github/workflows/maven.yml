name: Test Automation workflow for july

on:
  schedule:
    - cron: 00 18 * * *
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Running UI Automation tests
      run: mvn test -X
    - name: Upload Test logs
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
       name: Test Logs
       path: logs/

    - name: Upload Test reports
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
       name: Test Logs
       path: logs/

    - name: Upload Test reports
      run: echo "Test Execution completed"

    
